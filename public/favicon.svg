  <circle cx="32" cy="32" r="31" fill="#0f172a" />
  
  <!-- Shiny Golden King Crown -->
  <g id="crown">
    <path d="M 19 18 L 23 8 L 32 14 L 41 8 L 45 18 Z" fill="#FACC15" stroke="#78350F" stroke-width="1.8" stroke-linejoin="round" />
    <circle cx="23" cy="8" r="1.8" fill="#EF4444" />
    <circle cx="32" cy="14" r="1.8" fill="#38BDF8" />
    <circle cx="41" cy="8" r="1.8" fill="#EF4444" />
    <line x1="20.5" y1="16" x2="43.5" y2="16" stroke="#CA8A04" stroke-width="1.2" />
  </g>

  <!-- Backpack (Oxygen Tank) -->
  <rect x="14" y="27" width="9" height="23" rx="4.5" fill="#881337" stroke="#000000" stroke-width="3" stroke-linejoin="round" />
  <rect x="14" y="27" width="9" height="15" rx="4.5" fill="#FF1E56" />

  <!-- Main Crewmate Body (Shadow Base) -->
