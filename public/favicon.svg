  <!-- Visor -->
  <rect x="31" y="25" width="20" height="14" rx="7" fill="#000000" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" />
  <rect x="32" y="26" width="18" height="12" rx="6" fill="#38BDF8" />
  <!-- Visor Lower Shadow -->
  <path d="M 32 32 C 37 36, 45 36, 50 32 L 50 32 C 50 36, 45 38, 41 38 C 36 38, 32 36, 32 32 Z" fill="#0284C7" />
  <!-- Visor Specular Reflection -->
  <ellipse cx="38" cy="29" rx="5" ry="2.2" transform="rotate(-15 38 29)" fill="#FFFFFF" opacity="0.95" />
</svg>
